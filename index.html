/* ============ ĐỌC SỐ TIỀN BẰNG CHỮ ============ */
function readGroup(n){
  const digits = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  let s = '';
  const hundred = Math.floor(n/100);
  const tenUnit = n%100;
  const ten = Math.floor(tenUnit/10);
  const unit = tenUnit%10;
  if(hundred>0){
    s += digits[hundred] + ' trăm ';
    if(tenUnit===0) return s.trim();
  }
  if(ten===0){
    if(unit>0){ if(hundred>0) s += 'lẻ '; s += digits[unit]; }
  } else if(ten===1){
    s += 'mười '; if(unit===5) s += 'lăm'; else if(unit>0) s += digits[unit];
  } else {
    s += digits[ten] + ' mươi '; if(unit===1) s += 'mốt'; else if(unit===5) s += 'lăm'; else if(unit>0) s += digits[unit];
  }
  return s.trim();
}
function numberToVietnameseWords(numLike){
  let num = Math.round(Number(numLike)||0);
  if(num===0) return '';
  if(num<0) return 'Âm ' + numberToVietnameseWords(-num).toLowerCase();
  const units = ['', 'nghìn', 'triệu', 'tỷ', 'nghìn tỷ', 'triệu tỷ'];
  let groups = []; let n = num;
  while(n>0){ groups.push(n%1000); n = Math.floor(n/1000); }
  let parts = [];
  for(let i=groups.length-1;i>=0;i--){
    if(groups[i]===0) continue;
    parts.push(readGroup(groups[i]) + (units[i]?(' '+units[i]):''));
  }
  let result = parts.join(' ').replace(/\s+/g,' ').trim();
  result = result.charAt(0).toUpperCase() + result.slice(1);
  return result + ' đồng';
}
function formatVNDDisplay(digitsStr){
  if(!digitsStr) return '';
  return Number(digitsStr).toLocaleString('vi-VN');
}

function filled(v){ return v!==undefined && v!==null && String(v).trim()!==''; }

/* ============ STATE ============ */
let state = JSON.parse(localStorage.getItem('khoiSuPlanState') || '{}');
let gatesPassedState = JSON.parse(localStorage.getItem('khoiSuGatesPassed') || '{}');
let currentIndex = 0;

let _saveTimer = null;
function saveState(){
  updatePageCounter();
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    localStorage.setItem('khoiSuPlanState', JSON.stringify(state));
    localStorage.setItem('khoiSuGatesPassed', JSON.stringify(gatesPassedState));
    checkAutoCompleteRewards();
    if(typeof renderNav==='function') renderNav();
    if(typeof renderProgressPanel==='function') renderProgressPanel();
  }, 350);
}
function get(path, def){
  const parts = path.split('.');
  let o = state;
  for(const p of parts){ if(o==null) return def; o = o[p]; }
  return o===undefined ? def : o;
}
function set(path, val){
  const parts = path.split('.');
  let o = state;
  for(let i=0;i<parts.length-1;i++){
    if(!o[parts[i]]) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
  saveState();
}

let toastQueue = [];
let toastShowing = false;
function showToast(msg, cls){
  if(toastQueue.length >= 2) return;
  toastQueue.push({msg, cls});
  processToastQueue();
}
function processToastQueue(){
  if(toastShowing || toastQueue.length===0) return;
  toastShowing = true;
  const {msg, cls} = toastQueue.shift();
  const t = document.createElement('div');
  t.className = 'toast' + (cls?(' '+cls):'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{
    t.remove();
    toastShowing = false;
    processToastQueue();
  }, 2000);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
let bigToastShowing = false;
function maybeShowMilestone(){
  const n = get('_milestoneCount', 0) + 1;
  set('_milestoneCount', n);
  if(n % 5 === 0 && !bigToastShowing){
    bigToastShowing = true;
    const bt = document.createElement('div');
    bt.className = 'big-toast';
    bt.textContent = pick(MILESTONE_MSGS);
    document.body.appendChild(bt);
    setTimeout(()=>{ bt.remove(); bigToastShowing = false; }, 3000);
  }
}
let previousDoneMap = {};
function checkAutoCompleteRewards(){
  SECTIONS.filter(s=>!s.gate && s.id!=='review').forEach(s=>{
    const doneNow = isDone(s.id);
    if(doneNow && !previousDoneMap[s.id]){
      showToast(pick(SECTION_MSGS));
      maybeShowMilestone();
    }
    previousDoneMap[s.id] = doneNow;
  });
}

function computeTongDoanhThuNgay(){
  const ca = get('p6.ca', []);
  const giatrihd = Number(get('p6.giatrihd',0));
  let tong = 0;
  ca.forEach(c=>{ tong += Number(c.khach||0) * giatrihd; });
  return tong;
}
function computeCongSuatCa(khach){
  const tongGhe = Number(get('p5.sochongoi',0));
  if(!tongGhe) return 0;
  return (Number(khach||0) / tongGhe) * 100;
}
function computeKichBan(){
  const ngayMucTieu = computeTongDoanhThuNgay();
  const songay = Number(get('p6.songaymở',26));
  const biquanPct = Number(get('p6.kb_biquan_pct',0));
  const tbPct = Number(get('p6.kb_tb_pct',0));
  const xuatsacPct = Number(get('p6.kb_xuatsac_pct',0));
  const biquanNgay = ngayMucTieu * biquanPct/100;
  const tbNgay = ngayMucTieu * tbPct/100;
  const xuatsacNgay = ngayMucTieu * xuatsacPct/100;
  return {
    ngayMucTieu, songay,
    biquanNgay, tbNgay, xuatsacNgay,
    biquanThang: biquanNgay*songay, tbThang: tbNgay*songay, xuatsacThang: xuatsacNgay*songay
  };
}
function computeOpexFixedPart(){
  return Number(get('p8.thue',0))+Number(get('p8.nhansu',0))+Number(get('p8.diennuoc',0))+Number(get('p8.marketing_chiphi',0))+Number(get('p8.khac',0));
}
function computeTongVonDauTu(){
  const items = get('p7.items', []);
  const totalCapex = items.reduce((a,b)=>a+Number(b.chiphi||0),0);
  const uocCount = items.filter(i=>i.dotincay==='Ước tính').length;
  const ratio = items.length ? uocCount/items.length : 0;
  const pct = ratio>0.5?0.20:ratio>0.2?0.15:0.10;
  const duphongVon = Math.round(totalCapex*pct);
  const opexTotal = computeOpexFixedPart() + Number(get('p8.nvl',0));
  const soThangDP = Number(get('p7.sothangduphong',3));
  const vonluudong = opexTotal * soThangDP;
  const tongVon = totalCapex + duphongVon + vonluudong;
  return {totalCapex, ratio, pct, duphongVon, vonluudong, tongVon};
}
function computeProfit(){
  const kb = computeKichBan();
  const opexTotal = computeOpexFixedPart() + Number(get('p8.nvl',0));
  return kb.tbThang - opexTotal;
}
function computeBreakeven(){
  const opexFixed = computeOpexFixedPart();
  const nvlPct = Number(get('p8.nvl_pct',0))/100;
  const revenue = nvlPct < 1 ? opexFixed / (1-nvlPct) : 0;
  const opexTotal = opexFixed + Number(get('p8.nvl',0));
  return {revenue: Math.round(revenue), opexTotal};
}
function computeThang11(){
  const kb = computeKichBan();
  const nvlPct = Number(get('p8.nvl_pct',0))/100;
  const fixedOpex = computeOpexFixedPart();
  const rows = get('p11.thang', [1,2,3,4,5,6].map(n=>({thang:'Tháng '+n, congsuat:''})));
  let cum = 0;
  return rows.map(r=>{
    const congsuat = Number(r.congsuat||0);
    const thu = kb.ngayMucTieu * kb.songay * congsuat/100;
    const chi = fixedOpex + thu*nvlPct;
    const loinhuan = thu - chi;
    cum += loinhuan;
    return {thang:r.thang, congsuat, thu, chi, loinhuan, cum};
  });
}

function isDone(id){
  if(id==='terms') return !!gatesPassedState['terms'];
  if(id.startsWith('gate')) return !!gatesPassedState[id];
  const req = REQUIRED[id];
  if(!req) return false;
  const data = state[id] || {};
  if(!req.every(k=> filled(data[k]))) return false;
  if(id==='p2'){ if((data.nhom||[]).filter(r=>filled(r.ten)).length < 2) return false; }
  if(id==='p3'){ if((data.doithu||[]).filter(r=>filled(r.ten)).length < 3) return false; }
  if(id==='p4'){ if(!data.filename || (data.soMon||0) < 5) return false; }
  if(id==='p11'){ const rows=data.thang||[]; if(rows.length<6 || !rows.every(r=>filled(r.congsuat))) return false; }
  if(id==='p13'){ const rows=data.kenh||[]; if(!rows.every(r=>filled(r.ngansach))) return false; }
  if(id==='p15'){ if((data.ruiro||[]).filter(r=>filled(r.ten)).length < 3) return false; }
  if(id==='p15b'){ if(!data.camket) return false; }
  if(id==='p16'){ const rows=data.moc||[]; if(rows.length<4 || !rows.every(r=>filled(r.thoigian)&&filled(r.congviec))) return false; }
  if(id==='p6'){ const ca = data.ca||[]; if(!ca.some(c=>filled(c.khach))) return false; }
  return true;
}

/* ============ CROSS-CHECK LOGIC ============ */
function crossChecks(){
  const warns = [];
  const sochongoi = Number(get('p5.sochongoi',0));
  const ca = get('p6.ca', []);
  const maxKhach = ca.reduce((m,c)=>Math.max(m,Number(c.khach||0)),0);
  if(sochongoi && maxKhach && maxKhach > sochongoi){
    warns.push('Có khung giờ ở Phần 6 khai số khách kỳ vọng ('+maxKhach+') lớn hơn tổng số ghế đã khai ở Phần 5 ('+sochongoi+'). Kiểm tra lại.');
  }
  const {duphongVon, vonluudong} = computeTongVonDauTu();
  const rows11 = computeThang11();
  const minCum = rows11.length ? Math.min(...rows11.map(r=>r.cum)) : 0;
  const duphongTong = duphongVon; // dự phòng phát sinh, không tính vốn lưu động (đã tách riêng theo tháng)
  if(rows11.some(r=>filled(r.congsuat)) && Math.abs(Math.min(0,minCum)) > duphongTong + vonluudong){
    warns.push('Dòng tiền âm sâu nhất trong 6 tháng đầu ('+Math.abs(Math.min(0,minCum)).toLocaleString('vi-VN')+' đ) vượt quá vốn dự phòng ở Phần 7. Cần tăng vốn dự phòng hoặc điều chỉnh lộ trình công suất.');
  }
  const opexMkt = Number(get('p8.marketing_chiphi',0));
  const kenh13 = get('p13.kenh', []);
  const tongKenh = kenh13.reduce((a,b)=>a+Number(b.ngansach||0),0);
  if(opexMkt && tongKenh && Math.abs(opexMkt - tongKenh) > opexMkt*0.15){
    warns.push('Ngân sách marketing ở Phần 8 ('+opexMkt.toLocaleString('vi-VN')+' đ) không khớp với tổng ngân sách các kênh ở Phần 13 ('+tongKenh.toLocaleString('vi-VN')+' đ).');
  }
  const kb = computeKichBan();
  const be = computeBreakeven();
  if(kb.biquanThang && be.revenue && kb.biquanThang < be.revenue){
    warns.push('Kịch bản doanh thu bi quan ('+Math.round(kb.biquanThang).toLocaleString('vi-VN')+' đ/tháng) vẫn THẤP HƠN điểm hoà vốn ('+be.revenue.toLocaleString('vi-VN')+' đ/tháng). Cần giải trình phương án xử lý ở Phần 9.');
  }
  const vonKhaDung = Number(get('p7.von_khonglai',0)) + Number(get('p7.von_colai',0));
  const {tongVon} = computeTongVonDauTu();
  if(tongVon>0 && vonKhaDung>0 && vonKhaDung < tongVon){
    warns.push('Vốn khả dụng (không lãi + có lãi: '+vonKhaDung.toLocaleString('vi-VN')+' đ) chưa đủ so với tổng vốn đầu tư cần ở Phần 7 ('+tongVon.toLocaleString('vi-VN')+' đ).');
  }
  return warns;
}

  container.appendChild(lab);

  if(opts.type==='money'){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.placeholder = 'VD: 50.000.000';
    const rawInit = String(get(opts.path,'')).replace(/\D/g,'');
    inp.value = formatVNDDisplay(rawInit);
    check.style.opacity = rawInit ? 1 : 0;
    const wordsCaption = document.createElement('div');
    wordsCaption.className = 'small-note';
    wordsCaption.style.marginTop = '2px';
    wordsCaption.textContent = rawInit ? numberToVietnameseWords(rawInit) : '';
    inp.oninput = ()=>{
      const digits = inp.value.replace(/\D/g,'');
      inp.value = formatVNDDisplay(digits);
      set(opts.path, digits);
      check.style.opacity = digits ? 1 : 0;
      wordsCaption.textContent = digits ? numberToVietnameseWords(digits) : '';
      if(opts.onChange) opts.onChange();
    };
    container.appendChild(inp);
    container.appendChild(wordsCaption);
    return inp;
  }

  let inp;
  if(opts.type==='textarea'){ inp = document.createElement('textarea'); }
  else { inp = document.createElement('input'); inp.type = opts.type||'text'; }
  inp.value = get(opts.path,'');
  check.style.opacity = String(inp.value).trim()!=='' ? 1 : 0;
  inp.oninput = ()=>{
    set(opts.path, inp.value);
    check.style.opacity = String(inp.value).trim()!=='' ? 1 : 0;
    if(opts.onChange) opts.onChange();
  };
  container.appendChild(inp);
  return inp;
}

function dynTable(container, opts){
  const wrap = document.createElement('div');
  const tbl = document.createElement('table');
  const thead = document.createElement('tr');
  opts.cols.forEach(c=>{ const th=document.createElement('th'); th.textContent=c.label; thead.appendChild(th); });
  const thRemove = document.createElement('th'); thead.appendChild(thRemove);
  tbl.appendChild(thead);
  let rows = get(opts.path, opts.initRows || []);
  function renderRows(){
    [...tbl.querySelectorAll('tr')].slice(1).forEach(r=>r.remove());
    rows.forEach((row,ri)=>{
      const tr = document.createElement('tr');
      const autoCells = {};
      opts.cols.forEach(c=>{
        const td = document.createElement('td');
        if(c.auto){
          const span = document.createElement('span');
          span.className = 'auto-cell';
          span.textContent = c.autoFormat ? c.autoFormat(c.auto(row)) : String(Math.round(c.auto(row)||0));
          td.appendChild(span);
          autoCells[c.key] = span;
        } else if(c.type==='textarea'){
          const ta = document.createElement('textarea');
          ta.style.minHeight='48px'; ta.rows=2;
          ta.value = row[c.key]||'';
          ta.oninput = ()=>{ rows[ri][c.key]=ta.value; set(opts.path, rows); };
          td.appendChild(ta);
        } else {
          const inp = document.createElement('input');
          inp.type = c.type||'text';
          inp.value = row[c.key]||'';
          inp.oninput = ()=>{
            rows[ri][c.key]=inp.value; set(opts.path, rows);
            opts.cols.forEach(cc=>{ if(cc.auto && autoCells[cc.key]) autoCells[cc.key].textContent = cc.autoFormat ? cc.autoFormat(cc.auto(rows[ri])) : String(Math.round(cc.auto(rows[ri])||0)); });
          };
          td.appendChild(inp);
        }
        tr.appendChild(td);
      });
      const tdr = document.createElement('td');
      const rm = document.createElement('button');
      rm.className='remove-row'; rm.textContent='Xoá';
      rm.onclick = ()=>{ rows.splice(ri,1); set(opts.path, rows); renderRows(); };
      tdr.appendChild(rm);
      tr.appendChild(tdr);
      tbl.appendChild(tr);
    });
  }
  renderRows();
  wrap.appendChild(tbl);
  if(!opts.noAdd){
    const addBtn = document.createElement('button');
    addBtn.className='btn btn-add'; addBtn.textContent = '+ ' + (opts.addLabel||'Thêm dòng');
    addBtn.onclick = ()=>{
      const nr = {}; opts.cols.forEach(c=>nr[c.key]='');
      rows.push(nr); set(opts.path, rows); renderRows();
    };
    wrap.appendChild(addBtn);
  }
  container.appendChild(wrap);
}

/* ============ PHẦN 6 — DỰ BÁO DOANH THU (render riêng, có recompute reactive) ============ */
function renderPhan6(card){
  card.innerHTML = '<h1>Phần 6 — Dự báo doanh thu</h1>';
  card.innerHTML += '<h2 style="margin-top:10px">6.1 Công suất mục tiêu khi thành công — quán chạy ổn định</h2><p class="subtitle">Tính doanh thu mục tiêu lý tưởng theo từng khung giờ trong ngày.</p>';

  const tongGheStat = document.createElement('div'); tongGheStat.className='stat'; tongGheStat.style.marginBottom='10px';
  tongGheStat.innerHTML = '<div class="l">Tổng số ghế (lấy từ Phần 5)</div><div class="v">'+Number(get('p5.sochongoi',0))+' ghế</div>';
  card.appendChild(tongGheStat);

  field(card,{label:'Giá trị hoá đơn trung bình/khách (VNĐ)',path:'p6.giatrihd',type:'money',onChange:recomputeP6});

  let ca = get('p6.ca', null);
  if(!ca){
    ca = [
      {ten:'Sáng', gioBD:'', gioKT:'', khach:''},
      {ten:'Giữa sáng', gioBD:'', gioKT:'', khach:''},
      {ten:'Trưa', gioBD:'', gioKT:'', khach:''},
      {ten:'Chiều', gioBD:'', gioKT:'', khach:''},
      {ten:'Tối', gioBD:'', gioKT:'', khach:''},
    ];
    set('p6.ca', ca);
  }

  const tbl = document.createElement('table');
  tbl.innerHTML = '<tr><th>Khung giờ (bữa)</th><th>Giờ bắt đầu</th><th>Giờ kết thúc</th><th>Số khách kỳ vọng</th><th>Công suất %</th><th>Doanh thu ca</th></tr>';
  const congSuatCells = [], doanhThuCells = [];
  ca.forEach((c,i)=>{
    const tr = document.createElement('tr');
    const tdTen = document.createElement('td'); tdTen.textContent = c.ten; tdTen.style.fontWeight='600';
    const tdBD = document.createElement('td'); const inpBD = document.createElement('input'); inpBD.value=c.gioBD; inpBD.placeholder='VD: 07:00';
    inpBD.oninput = ()=>{ ca[i].gioBD = inpBD.value; set('p6.ca', ca); };
    tdBD.appendChild(inpBD);
    const tdKT = document.createElement('td'); const inpKT = document.createElement('input'); inpKT.value=c.gioKT; inpKT.placeholder='VD: 09:30';
    inpKT.oninput = ()=>{ ca[i].gioKT = inpKT.value; set('p6.ca', ca); };
    tdKT.appendChild(inpKT);
    const tdKhach = document.createElement('td'); const inpKhach = document.createElement('input'); inpKhach.type='number'; inpKhach.value=c.khach;
    inpKhach.oninput = ()=>{ ca[i].khach = inpKhach.value; set('p6.ca', ca); recomputeP6(); };
    tdKhach.appendChild(inpKhach);
    const tdCS = document.createElement('td'); const spanCS = document.createElement('span'); spanCS.className='auto-cell'; tdCS.appendChild(spanCS);
    const tdDT = document.createElement('td'); const spanDT = document.createElement('span'); spanDT.className='auto-cell'; tdDT.appendChild(spanDT);
    congSuatCells.push(spanCS); doanhThuCells.push(spanDT);
    tr.appendChild(tdTen); tr.appendChild(tdBD); tr.appendChild(tdKT); tr.appendChild(tdKhach); tr.appendChild(tdCS); tr.appendChild(tdDT);
    tbl.appendChild(tr);
  });
  card.appendChild(tbl);

  const tongDiv = document.createElement('div'); tongDiv.className='stat'; tongDiv.style.marginTop='12px';
  card.appendChild(tongDiv);
  const tongWordsDiv = document.createElement('p'); tongWordsDiv.className='small-note';
  card.appendChild(tongWordsDiv);

  function recomputeP6(){
    const giatrihd = Number(get('p6.giatrihd',0));
    const tongGhe = Number(get('p5.sochongoi',0));
    let tong = 0;
    ca.forEach((c,i)=>{
      const khach = Number(c.khach||0);
      const cs = tongGhe ? (khach/tongGhe*100) : 0;
      const dt = khach*giatrihd;
      tong += dt;
      congSuatCells[i].textContent = cs.toFixed(0)+'%';
      doanhThuCells[i].textContent = Math.round(dt).toLocaleString('vi-VN')+' đ';
    });
    tongDiv.innerHTML = '<div class="l">Tổng doanh thu/ngày mục tiêu</div><div class="v">'+Math.round(tong).toLocaleString('vi-VN')+' đ</div>';
    tongWordsDiv.textContent = tong>0 ? 'Bằng chữ: '+numberToVietnameseWords(tong) : '';
    recomputeKichBan();
  }
  recomputeP6();

  field(card,{label:'Số khách kỳ vọng mỗi khung giờ dựa trên căn cứ gì?',path:'p6.giaithich_congsuat',type:'textarea',reason:true});
  field(card,{label:'Số ngày mở cửa/tháng',path:'p6.songaymở',type:'number',onChange:recomputeP6});

  card.innerHTML += '<h2 style="margin-top:22px">6.2 Ba kịch bản (tính theo ngày, quy đổi ra tháng)</h2><p class="subtitle">Chỉ cần điền % so với doanh thu mục tiêu lý tưởng ở trên — tiền tự nhảy.</p>';

  const kbWrap = document.createElement('div');
  card.appendChild(kbWrap);

  function kbRow(label, pctPath){
    const rowDiv = document.createElement('div');
    field(rowDiv, {label: label+' — % so với mục tiêu lý tưởng', path: pctPath, type:'number', onChange: recomputeKichBan});
    const statD = document.createElement('div'); statD.className='stat-grid'; statD.style.marginTop='6px';
    rowDiv.appendChild(statD);
    kbWrap.appendChild(rowDiv);
    return statD;
  }
  const statBiquan = kbRow('Kịch bản bi quan', 'p6.kb_biquan_pct');
  const statTB = kbRow('Kịch bản trung bình', 'p6.kb_tb_pct');
  const statXuatsac = kbRow('Kịch bản xuất sắc', 'p6.kb_xuatsac_pct');

  function recomputeKichBan(){
    const kb = computeKichBan();
    statBiquan.innerHTML = '<div class="stat"><div class="l">Doanh thu/ngày</div><div class="v">'+Math.round(kb.biquanNgay).toLocaleString('vi-VN')+' đ</div></div><div class="stat"><div class="l">Doanh thu/tháng</div><div class="v">'+Math.round(kb.biquanThang).toLocaleString('vi-VN')+' đ</div></div>';
    statTB.innerHTML = '<div class="stat"><div class="l">Doanh thu/ngày</div><div class="v">'+Math.round(kb.tbNgay).toLocaleString('vi-VN')+' đ</div></div><div class="stat"><div class="l">Doanh thu/tháng</div><div class="v">'+Math.round(kb.tbThang).toLocaleString('vi-VN')+' đ</div></div>';
    statXuatsac.innerHTML = '<div class="stat"><div class="l">Doanh thu/ngày</div><div class="v">'+Math.round(kb.xuatsacNgay).toLocaleString('vi-VN')+' đ</div></div><div class="stat"><div class="l">Doanh thu/tháng</div><div class="v">'+Math.round(kb.xuatsacThang).toLocaleString('vi-VN')+' đ</div></div>';
    set('p6.kb_biquan_doanhthu', Math.round(kb.biquanThang));
    set('p6.kb_tb_doanhthu', Math.round(kb.tbThang));
    set('p6.kb_xuatsac_doanhthu', Math.round(kb.xuatsacThang));
  }
  recomputeKichBan();

/* ============ FOOD COST EXCEL ============ */
function downloadFoodCostTemplate(){
  const wb = XLSX.utils.book_new();
  const data = [
    ['Món','Nguyên liệu','Định lượng/suất','Đơn vị','Đơn giá (VNĐ)','Thành tiền (VNĐ)','Giá bán (VNĐ)'],
    ['VD: Phở bò','Bánh phở','200','g','40','8000','45000'],
    ['VD: Phở bò','Thịt bò','100','g','300','30000',''],
    ['','','','','','',''],
  ];
  const ws = XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, 'FoodCost');
  XLSX.writeFile(wb, 'template-foodcost-andy-academy.xlsx');
}
function handleFoodCostUpload(e, card){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    const wb = XLSX.read(evt.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    const required = ['Món','Nguyên liệu','Định lượng/suất','Đơn giá (VNĐ)','Thành tiền (VNĐ)','Giá bán (VNĐ)'];
    const cols = rows.length ? Object.keys(rows[0]) : [];
    const missing = required.filter(r=>!cols.includes(r));
    const status = document.getElementById('foodcost-status');
    if(missing.length){
      status.className='warning'; status.innerHTML='⚠️ File thiếu cột: '+missing.join(', ')+'. Vui lòng dùng đúng template và nộp lại.';
      return;
    }
    const validRows = rows.filter(r=>r['Món']);
    const byMon = {};
    validRows.forEach(r=>{
      const mon = r['Món'];
      if(!byMon[mon]) byMon[mon] = {cost:0, gia: Number(r['Giá bán (VNĐ)'])||0};
      byMon[mon].cost += Number(r['Thành tiền (VNĐ)'])||0;
      if(r['Giá bán (VNĐ)']) byMon[mon].gia = Number(r['Giá bán (VNĐ)']);
    });
    const monNames = Object.keys(byMon);
    if(monNames.length < 5){
      status.className='warning'; status.innerHTML='⚠️ Cần tối thiểu 5 món, file hiện chỉ có '+monNames.length+' món.';
      return;
    }
    let sumPct = 0, countPct = 0, avgGia = 0;
    monNames.forEach(m=>{
      if(byMon[m].gia>0){ sumPct += byMon[m].cost/byMon[m].gia; countPct++; avgGia += byMon[m].gia; }
    });
    const avgFoodCost = countPct ? Math.round((sumPct/countPct)*1000)/10 : 0;
    avgGia = countPct ? Math.round(avgGia/countPct) : 0;
    set('p4.filename', file.name);
    set('p4.avgFoodCost', avgFoodCost);
    set('p4.soMon', monNames.length);
    set('p4.giaBanTB', avgGia);
    status.className='ok-msg';
    status.innerHTML = 'Đã nộp: '+file.name+' — '+monNames.length+' món — Food cost % trung bình: <b>'+avgFoodCost+'%</b>';
  };
  reader.readAsBinaryString(file);
}

    {label:'Đã tích đủ Cam kết trách nhiệm', ok: !!gatesPassedState['terms']},
    {label:'Phần 4: đã nộp file food cost hợp lệ, tối thiểu 5 món', ok: !!get('p4.filename') && get('p4.soMon',0)>=5},
    {label:'Phần 3: tối thiểu 3 đối thủ', ok: get('p3.doithu',[]).length>=3},
    {label:'Phần 14: tối thiểu 3 rủi ro', ok: get('p15.ruiro',[]).length>=3},
    {label:'Phần 2: tổng tỷ trọng các nhóm khách hàng ≈ 100%', ok: (()=>{ const n=get('p2.nhom',[]); const t=n.reduce((a,b)=>a+Number(b.tytrong||0),0); return t>=95&&t<=105; })()},
    {label:'Không còn cảnh báo kiểm tra chéo nào', ok: crossChecks().length===0},
  ];
  return items;
}
function skippedGatesList(){ return skippedGates(); }

function renderReview(card){
  card.innerHTML = '<h1>Phản biện & Xuất kế hoạch</h1>'+
    '<div class="serious-banner">"Đây là lúc quyết định: bạn làm bản kế hoạch này cho có, hay làm nó để thật sự đi mở quán? Không ai kiểm tra bạn ngoài chính bạn — nhưng vốn thật, tiền thật sẽ không nương tay nếu bạn làm qua loa."</div>'+
    '<p class="subtitle">Kiểm tra cứng tự động trước khi mở khoá lớp phản biện.</p>';

  const mucTieu = Number(get('p0c.loinhuan_mucTieu',0));
  const thucTe = computeProfit();
  if(mucTieu){
    const dat = thucTe >= mucTieu*0.8;
    const dreamDiv = document.createElement('div');
    dreamDiv.className = dat ? 'ok-msg' : 'warning';
    dreamDiv.innerHTML = (dat ? '🎯 Kế hoạch của bạn đang tiến sát mục tiêu bạn đặt ra ban đầu! ' : '⏳ Chưa chạm tới mục tiêu bạn đặt ra ban đầu. ')+
      '<br>Mục tiêu lợi nhuận: <b>'+mucTieu.toLocaleString('vi-VN')+' đ/tháng</b> — Kế hoạch hiện tại tạo ra: <b>'+Math.round(thucTe).toLocaleString('vi-VN')+' đ/tháng</b>.';
    card.appendChild(dreamDiv);
  }

  const quymoVonUocLuong = Number(get('p0.quymovon',0));
  const {tongVon: tongVonThucTe} = computeTongVonDauTu();
  if(quymoVonUocLuong && tongVonThucTe){
    const lech = Math.abs(tongVonThucTe - quymoVonUocLuong) / quymoVonUocLuong;
    const khopVon = lech <= 0.25;
    const vonCompareDiv = document.createElement('div');
    vonCompareDiv.className = khopVon ? 'ok-msg' : 'warning';
    vonCompareDiv.innerHTML = (khopVon ? '✓ Ước lượng vốn ban đầu khá sát với tính toán chi tiết. ' : '⚠️ Ước lượng vốn ban đầu lệch khá xa so với tính toán chi tiết — bình thường ở lần đầu làm kế hoạch, nhưng đáng để nhìn lại. ')+
      '<br>Ước lượng ban đầu (Phần 0): <b>'+quymoVonUocLuong.toLocaleString('vi-VN')+' đ</b> — Tính toán chi tiết thực tế (Phần 7): <b>'+Math.round(tongVonThucTe).toLocaleString('vi-VN')+' đ</b>.';
    card.appendChild(vonCompareDiv);
  }

  const vbCard = document.createElement('div');
  vbCard.style.marginTop='16px';
  vbCard.innerHTML = '<h2>Vision Board — cuộc sống mơ ước của bạn</h2>'+
    '<p class="subtitle">Con số phía trên chưa phải là thực tế — quán chưa mở thì chưa ai biết chắc. Nhưng nó không còn là tưởng tượng suông nữa: đó là con số được tính từ chính những giả định bạn đã phải chứng minh trong suốt kế hoạch này. Giờ hãy vẽ bằng chữ: gia đình, tài chính, sức khoẻ, thời gian tự do... trong đó dự án F&B này đóng vai trò gì, và vì sao cuộc sống đó khiến bạn thật sự hạnh phúc.</p>';
  card.appendChild(vbCard);
  field(vbCard,{label:'Mô tả vision board của bạn',path:'p0c.visionboard',type:'textarea'});
  const vbTextarea = vbCard.querySelector('textarea');
  if(vbTextarea) vbTextarea.style.minHeight = '160px';

  const skipped = skippedGatesList();
  if(skipped.length){
    const skipDiv = document.createElement('div');
    skipDiv.className = 'warning';
    skipDiv.innerHTML = '⏭ Đã bỏ qua kiểm tra kiến thức (chọn "Em sẽ chứng minh ạ") ở: <b>'+skipped.join(', ')+'</b> — nội dung phần tương ứng cần đủ chặt chẽ để tự chứng minh trong lớp phản biện.';
    card.appendChild(skipDiv);
  }

  const items = checklistStatus();
  items.forEach(it=>{
    const div = document.createElement('div');
    div.className = it.ok ? 'ok-msg' : 'warning';
    div.textContent = (it.ok?'✓ ':'⚠️ ') + it.label;
    card.appendChild(div);
  });
  const allOk = items.every(i=>i.ok);
  const noteAI = document.createElement('div');
  noteAI.className = 'small-note';
  noteAI.style.marginTop='14px';
  noteAI.innerHTML = 'Lớp phản biện AI (đóng vai nhà đầu tư khó tính) và chấm mềm theo rubric sẽ được bật khi tích hợp API — hiện tại phần khung đã sẵn sàng, chờ Andy duyệt rubric + bài mẫu.';
  card.appendChild(noteAI);

  const exportBtn = document.createElement('button');
  exportBtn.className = 'btn btn-primary';
  exportBtn.style.marginTop = '16px';
  exportBtn.textContent = allOk ? '⬇ Xuất kế hoạch ra Word' : '⬇ Xuất bản nháp (chưa qua hết kiểm tra)';
  exportBtn.onclick = exportWord;
  card.appendChild(exportBtn);
}
